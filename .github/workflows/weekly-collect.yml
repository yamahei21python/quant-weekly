name: Weekly Collect

# 毎週日曜 09:00 UTC = 18:00 JST に Reddit/arXiv を収集し digest を生成
on:
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Reddit (Xpoz)
        run: python fetch_reddit.py
        env:
          XPOZ_API_KEY: ${{ secrets.XPOZ_API_KEY }}

      - name: Fetch arXiv
        run: python fetch_arxiv.py

      - name: Build digest
        run: python build_digest.py

      - name: Commit and push
        run: |
          git config user.name "quant-weekly-bot"
          git config user.email "quant-weekly-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || {
            git commit -m "chore: weekly collect $(date +%F)"
            git push
          }
