name: Grok X Ingest

# Zapier(Email by Zapier → GitHub dispatch)から grok-x 内容を受け取り保存 + digest 再生成
on:
  repository_dispatch:
    types: [grok-x-email]

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Save grok-x markdown
        env:
          DATE: ${{ github.event.client_payload.date }}
          CONTENT_B64: ${{ github.event.client_payload.content_b64 }}
        run: |
          if [ -z "$CONTENT_B64" ]; then
            echo "ERROR: client_payload.content_b64 が空。Zapier設定を確認してください" >&2
            exit 1
          fi
          python3 - <<'EOF'
          import base64, os
          from datetime import date
          content = base64.b64decode(os.environ['CONTENT_B64']).decode('utf-8')
          date_str = os.environ.get('DATE') or date.today().isoformat()
          path = f'grok-x-{date_str}.md'
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          print(f'Saved {path} ({len(content)} chars)')
          EOF

      - name: Build digest
        env:
          DATE: ${{ github.event.client_payload.date }}
        run: |
          if [ -n "$DATE" ]; then
            python build_digest.py "$DATE"
          else
            python build_digest.py
          fi

      - name: Commit and push
        run: |
          git config user.name "quant-weekly-bot"
          git config user.email "quant-weekly-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || {
            git commit -m "chore: ingest grok-x $(date +%F)"
            git push
          }
